[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "report-generator-frs-105"
version = "0.1.0"
description = "Egress-Interface Kit projecting clawdog-brain Phase 4a.3 bridge canon for FRS 105 Micro × FRC v2026. Deterministic LodgeiT-SBRM-slug → FRC-element resolver."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "LodgeiT Labs" }]
keywords = ["sbrm", "frs-105", "frc-v2026", "uk-tax", "ixbrl", "bridge-canon"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "PyYAML>=6.0",
  "jsonschema>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
report-generator-frs-105 = "report_generator_frs_105.cli:main"

[project.urls]
Homepage = "https://github.com/lodgeit-labs/report-generator-frs-105"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"report_generator_frs_105" = ["py.typed"]
