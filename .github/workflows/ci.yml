name: Kit CI

# Egress-Interface Kit for the FRS 105 Micro × FRC v2026 bridge canon.
# Mirrors the gate discipline of lodgeit-labs/clawdog:
#
#   Gate 1 — Unit tests for the resolver library (resolve_concept and friends)
#            against the production-vendored bundle (Standing Rule #12).
#
#   Gate 2 — Bridge-canon byte-fidelity. Recomputes sha256 of every vendored
#            file in bridge_canon/ + bridge_canon_sidecars/ and asserts
#            equality with bridge_canon/MANIFEST.json. Mirrors exactly the
#            CLAWDOG/141 Gate 3 pattern in lodgeit-labs/clawdog
#            .github/workflows/test.yml. When Brain canon is re-vendored
#            (scripts/revendor_from_brain.py) the manifest refreshes
#            automatically.
#
# Per `clawdog-brain` Standing Rule #7 (Repository Topology) the Kit is an
# Egress Interface: the bridge_canon/ tree is a read-only projection of
# Brain canon. Direct Kit-side mutation of any vendored file fails Gate 2
# at PR time.

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  resolver-unit-tests:
    name: Gate 1 — Resolver unit tests (production-vendored bundle)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run resolver unit tests
        run: |
          set -e
          python -m pytest tests/test_resolver.py -v

      - name: CLI smoke test (resolve equity)
        run: |
          set -e
          python -m report_generator_frs_105 resolve equity | tee /tmp/cli_out.json
          python -c "import json,sys; d=json.load(open('/tmp/cli_out.json')); assert d['framework_concept']=='uk-core:Equity', d"

      - name: CLI smoke test (resolve sbrm_4101)
        run: |
          set -e
          python -m report_generator_frs_105 resolve sbrm_4101 | tee /tmp/cli_out2.json
          python -c "import json,sys; d=json.load(open('/tmp/cli_out2.json')); assert d['framework_concept']=='uk-core:TurnoverRevenue', d; assert d['mapping_kind']=='direct_atom', d"

  bridge-canon-byte-check:
    name: Gate 2 — Bridge canon byte-fidelity (CLAWDOG/141 precedent)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify every vendored canon file matches MANIFEST.json sha256
        # Per `clawdog-brain` Standing Rule #11 (Verbatim Claims) + CLAWDOG/141
        # §6.2 precedent: the bridge_canon/ tree is a byte-identical mirror
        # of Brain canon at the declared SOURCE_BRAIN_CANON_COMMIT. Any
        # divergence is either:
        #   (a) unauthorised Kit-side mutation (Standing Rule #7 — Egress
        #       Interface projection is read-only); OR
        #   (b) re-vendor without manifest refresh — re-run
        #       scripts/revendor_from_brain.py to align.
        run: |
          set -e
          python -m pytest tests/test_bridge_canon_byte_fidelity.py -v
